plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.2.1'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

apply from: 'gradle/atlas.gradle'

neoForge {
    version = loader_version
    mods { tfcatlas { sourceSet(sourceSets.main) } }
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation tfc_dependency
    runtimeOnly patchouli_dependency
    runtimeOnly xaero_dependency
    runtimeOnly minimap_dependency
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// Optional in-game test harness. Release packaging rejects this mode.
if (project.hasProperty('atlasSmoke')) {
    sourceSets.main.java.srcDirs 'src/smoke/java', 'src/test/java'
    sourceSets.main.java.exclude 'net/**'
    neoForge.runs.client {
        systemProperty 'tfcatlas.smoke', 'true'
        programArgument '--username'
        programArgument 'AtlasTest'
    }
}
